<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.json"><title>Kopi Tlusor POS</title>
<style>
:root{--ink:#16161a;--mut:#7a7a85;--ac:#d6338a;--acs:#fbe6f1;--bg:#fff;--ln:#ececf1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#fafafc;padding-bottom:150px}
.wrap{max-width:720px;margin:0 auto;padding:14px}
h2{margin:6px 0 12px;font-size:20px}
.in{width:100%;padding:14px;border:1px solid var(--ln);border-radius:14px;font-size:16px;background:#fff;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:#fff;border:1px solid var(--ln);border-radius:18px;padding:10px;text-align:left;font:inherit;display:flex;flex-direction:column;gap:2px;transition:transform .12s}
.card:active{transform:scale(.97)}.card small{color:var(--mut);font-size:13px}
.ph{height:90px;border-radius:12px;background:var(--acs);display:grid;place-items:center;font-size:34px;overflow:hidden;margin-bottom:6px}.ph img{width:100%;height:100%;object-fit:cover}
.btn{width:100%;padding:16px;border:0;border-radius:16px;background:var(--ink);color:#fff;font:600 16px inherit;font-family:inherit}
.btn.ac{background:var(--ac)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--ln)}.btn:disabled{opacity:.4}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chip{padding:11px 16px;border-radius:999px;border:1px solid var(--ln);background:#fff;font:inherit}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.lbl{font-size:13px;color:var(--mut);margin-top:8px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav button{flex:1;min-width:0;padding:10px 1px;border:0;background:none;font:12px inherit;color:var(--mut)}.nav button b{display:block;font-size:20px}
.nav button.on{color:var(--ac);font-weight:700}
.bar{position:fixed;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:6}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px;animation:up .2s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--ln)}
.qty{display:flex;align-items:center;gap:10px}.qty button{width:38px;height:38px;border-radius:50%;border:1px solid var(--ln);background:#fff;font-size:18px}
.box{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:12px;margin-bottom:10px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;z-index:99}.toast.bad{background:#c0242f;color:#fff}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.tot{font-size:22px;font-weight:700}.ok{color:#1a8f4d}.bad{color:#c0242f}.void{text-decoration:line-through;opacity:.5}
.login{max-width:360px;margin:12vh auto;text-align:center}.login .logo{font-size:56px}
.nav{justify-content:space-around;align-items:center;padding:8px 14px calc(8px + env(safe-area-inset-bottom))}
.nav .nb{flex:none;position:relative;width:54px;height:54px;border-radius:50%;border:0;padding:0;background:#fff;color:var(--ink);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.nav .nb.c{background:var(--ac);color:#fff;width:62px;height:62px;margin-top:-20px;box-shadow:0 6px 16px rgba(214,51,138,.4)}
.nav .nb.p{background:var(--ink);color:#fff}
.nav .nb svg{width:26px;height:26px}.lg{width:42px;height:42px;border-radius:50%;object-fit:cover}
.dot{position:absolute;top:-3px;right:-3px;background:var(--ac);color:#fff;font:700 11px/18px system-ui;min-width:18px;height:18px;border-radius:9px;text-align:center;font-style:normal;padding:0 4px}
.mi{padding:16px;border:1px solid var(--ln);border-radius:16px;background:#fff;font:600 16px system-ui;text-align:left;position:relative}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom)) 6px}
.nav .nb.p{background:none;box-shadow:none;color:var(--ink);width:38px;height:38px;justify-self:end}
.nav .nb.p svg{width:22px;height:22px}
.nav .nl{justify-self:start;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;max-width:34vw;color:var(--ink)}
.nav .nl .lg{width:34px;height:34px;border-radius:50%}
.nav .nl small{font-size:10px;line-height:1.1;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nav .nl .dot{top:-4px;right:-2px}
.drawer{position:fixed;left:0;right:0;top:0;bottom:calc(84px + env(safe-area-inset-bottom));z-index:9}
.dp{position:absolute;left:0;bottom:6px;width:max-content;min-width:190px;max-width:80vw;display:grid;gap:8px;padding:12px 14px 12px 8px;background:rgba(255,255,255,.75);backdrop-filter:blur(14px);border-radius:0 20px 20px 0;box-shadow:0 8px 24px rgba(0,0,0,.15);animation:inl .22s ease-out}
@keyframes inl{from{transform:translateX(-100%)}}
.dp button{background:var(--ac);color:#fff;border:0;border-radius:14px;padding:13px 18px;font:600 15px system-ui;text-align:left;position:relative;white-space:nowrap}
.dp .dot{background:#fff;color:var(--ac);top:-5px;right:-5px}
</style></head><body><div id="app"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbzRzd9iUHyB9iaLbn_7xYSSuMjb51yDs6KFs9yWFKHBDuMxxly3J2cVxORbHvq97ZBq/exec';
const $=s=>document.querySelector(s), rp=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date(Date.now()+7*36e5).toISOString().slice(0,10);
let S={tab:'kasir',cart:[],bayar:[],sheet:null,q:'',tgl:today(),tx:[],kas:{masuk:[],keluar:[]},jenis:'Kas In',...JSON.parse(localStorage.getItem('s')||'{}')};
const keep=()=>localStorage.setItem('s',JSON.stringify({token:S.token,user:S.user}));
function toast(m,bad){const t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
async function api(action,data){
  const r=await fetch(API,{method:'POST',body:JSON.stringify({action,token:S.token,data})});
  const j=await r.json(); if(!j.ok){ if(/Sesi habis/.test(j.error)) logout(); throw new Error(j.error);} return j.data;
}
function logout(){S.token=null;S.user=null;keep();render()}
async function doLogin(){const un=$('#u').value,pw=$('#p').value;S.busy=1;render();try{const d=await api('login',{username:un,password:pw});S.token=d.token;S.user=d.user;keep();await boot();}catch(e){toast(e.message,1)}S.busy=0;render()}
async function boot(){S.init=await api('init');S.kat=S.init.kategori[0]?.Nama;pollVp();loadCust();loadProfil()}
const opsi=j=>S.init.opsi.filter(o=>o.Jenis===j);
const katSel=()=>Number((S.init.kategori.find(k=>k.Nama===S.kat)||{})['Selisih Harga']||0);
const total=()=>S.cart.reduce((a,i)=>a+(i.base+katSel())*i.qty,0);
const paid=()=>S.bayar.reduce((a,b)=>a+(+b.jumlah||0),0)+poinVal();
const cnt=()=>S.cart.reduce((a,i)=>a+i.qty,0);

function pick(sku){
  const p=S.init.produk.find(x=>x.SKU===sku);
  S.sheet={t:'opsi',p,ukuran:opsi('Ukuran')[0]?.Nama||'',es:opsi('Es')[0]?.Nama||'',gula:opsi('Gula')[0]?.Nama||'',qty:1};render();
}
const ukSel=n=>Number((opsi('Ukuran').find(o=>o.Nama===n)||{})['Selisih Harga']||0);
function addCart(){
  const s=S.sheet,base=Number(s.p.Harga)+ukSel(s.ukuran);
  const ex=S.cart.find(i=>i.sku===s.p.SKU&&i.ukuran===s.ukuran&&i.es===s.es&&i.gula===s.gula);
  if(ex)ex.qty+=s.qty;else S.cart.push({sku:s.p.SKU,menu:s.p.Nama,ukuran:s.ukuran,es:s.es,gula:s.gula,qty:s.qty,base});
  S.sheet=null;render();
}
function openBayar(){S.bayar=[{metode:S.init.metode[0],jumlah:''}];S.cat='';S.sheet={t:'bayar'};render()}
function sum(){const t=total(),p=paid();$('#sum').innerHTML=`<div class=row><span>Total</span><span class=tot>${rp(t)}</span></div><div class=row><span>Dibayar</span><b>${rp(p)}</b></div><div class=row><span>${p>=t?'Kembalian':'Kurang'}</span><b class="${p>=t?'ok':'bad'}">${rp(Math.abs(p-t))}</b></div>`;$('#go').disabled=p<t||S.busy}
async function simpan(){
  if(S.busy)return;S.busy=1;$('#go').disabled=true;
  try{const r=await api('saveOrderP',{items:S.cart,kategori:S.kat,catatan:S.cat,pelanggan:S.pel?S.pel.ID:'',poin:S.pel?(S.poinPakai||0):0,bayar:S.bayar.map(b=>({metode:b.metode,jumlah:+b.jumlah||0}))});
    S.last=r;S.cart=[];S.bayar=[];S.pel=null;S.poinPakai=0;loadCust();S.sheet={t:'sukses'};toast('Transaksi tersimpan \u2713');
  }catch(e){toast(e.message,1)}S.busy=0;render()
}
function cetak(r,label){
  const w=window.open('','_blank');if(!w)return toast('Pop-up diblokir',1);
  const L=r.items.map(i=>`<div>${esc(i.menu)} ${esc([i.ukuran,i.es,i.gula].filter(Boolean).join('/'))}</div><div style="display:flex;justify-content:space-between"><span>${i.qty} x ${i.harga}</span><span>${i.sub}</span></div>`).join('');
  w.document.write(`<html><body style="width:48mm;font:12px monospace;margin:0"><center><b>${esc(r.toko)}</b><br>${esc(S.profil.alamat||'')}<br>${esc(r.tanggal)} ${esc(r.jam)}<br>${esc(r.id)} \u00b7 ${esc(r.kasir)}<br>${esc(r.kategori)}</center><hr>${L}<hr>${label?'':`<b>TOTAL ${rp(r.total)}</b><br>${r.bayar.map(b=>esc(b.metode)+' '+rp(b.jumlah)).join('<br>')}<br>Kembali ${rp(r.kembalian)}<br><center>${esc(S.profil.footer||'Terima kasih')}</center>`}<script>print()<\/script></body></html>`);w.document.close();
}
async function loadTx(){try{S.tx=await api('listTx',{tanggal:S.tgl})}catch(e){toast(e.message,1)}render()}
async function loadKas(){try{S.kas=await api('listKas2',{})}catch(e){toast(e.message,1)}render()}
async function voidTx(id){const pin=prompt('Masukkan PIN Owner untuk VOID '+id);if(!pin)return;try{await api('voidTx',{id,pin});toast('Transaksi di-VOID');loadTx()}catch(e){toast(e.message,1)}}
async function simpanKas(){const j=+$('#kj').value,k=$('#kk').value;try{await api('addKas',{jenis:S.jenis,jumlah:j,keterangan:k});toast(S.jenis+' tersimpan \u2713');loadKas()}catch(e){toast(e.message,1)}}
function go(t){S.drawer=false;S.tab=t;S.sheet=null;render();if(t==='riwayat'){loadTx();pollVp()};if(t==='kas')loadKas();if(t==='menu')loadMenu();if(t==='stok')loadStok();if(t==='dash')loadDash();if(t==='void')pollVp(1);if(t==='akt')loadAkt();if(t==='laporan')loadLap();if(t==='pelanggan')loadCust();if(t==='pengaturan')loadSet()}


const CFG=[['Opsi','Opsi order (Ukuran / Es / Gula)',['Jenis','Nama','Selisih Harga']],['KategoriOrder','Kategori order & markup harga',['Nama','Selisih Harga']],['MetodeBayar','Metode bayar',['Nama']]];
S.all=[];
const refreshInit=async()=>{S.init=await api('init');if(!S.init.kategori.find(k=>k.Nama===S.kat))S.kat=S.init.kategori[0]?.Nama};
async function loadMenu(){try{S.all=await api('listProduk')}catch(e){toast(e.message,1)}render();await refHd();render()}
const kats=()=>[...new Set((S.all||[]).map(p=>p.Kategori).filter(Boolean))];
function editMenu(sku){const p=S.all.find(x=>String(x.SKU)===sku)||{SKU:'',Nama:'',Kategori:'',Harga:'',Aktif:true,Foto:''};S.sheet={t:'produk',f:{...p}};render()}
function pilihFoto(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),m=Math.min(1,240/Math.max(im.width,im.height));c.width=im.width*m;c.height=im.height*m;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.sheet.f.Foto=c.toDataURL('image/jpeg',.7);render()};im.src=e.target.result};r.readAsDataURL(f)}
async function simpanMenu(){const f=S.sheet.f;try{await api('saveProduk',{sku:f.SKU,nama:f.Nama,kategori:f.Kategori,harga:f.Harga,aktif:f.Aktif!==false,foto:f.Foto});toast('Menu tersimpan \u2713');S.sheet=null;await refreshInit();await loadMenu()}catch(e){toast(e.message,1)}}
const cfgRows=n=>n==='Opsi'?S.init.opsi:n==='KategoriOrder'?S.init.kategori:S.init.metode.map(x=>({Nama:x}));
function cfgBox([n,t,cols]){
  const R=cfgRows(n).map((r,x)=>`<div class=row><span>${cols.map(c=>c==='Selisih Harga'?'+'+Number(r[c]).toLocaleString('id-ID'):esc(r[c])).join(' \u00b7 ')}</span><button class=chip onclick="delCfg('${n}',${x})">Hapus</button></div>`).join('');
  const F=cols.map((c,i)=>c==='Jenis'?`<select id="${n}_${i}" class=in><option>Ukuran</option><option>Es</option><option>Gula</option></select>`:`<input id="${n}_${i}" class=in placeholder="${c==='Selisih Harga'?'Selisih harga (Rp)':c}" ${c==='Selisih Harga'?'type=number inputmode=numeric':''}>`).join('');
  return `<div class=box><b>${t}</b>${R}<div style="margin-top:8px">${F}<button class="btn ghost" onclick="addCfg('${n}')">+ Simpan</button></div></div>`}
async function addCfg(n){const cols=CFG.find(c=>c[0]===n)[2],data={};cols.forEach((c,i)=>data[c]=document.getElementById(n+'_'+i).value);try{await api('simpanBaris',{sheet:n,data});await refreshInit();toast('Tersimpan \u2713')}catch(e){toast(e.message,1)}render()}
async function delCfg(n,i){if(!confirm('Hapus data ini?'))return;const r=cfgRows(n)[i],key={};(n==='Opsi'?['Jenis','Nama']:['Nama']).forEach(c=>key[c]=r[c]);try{await api('hapusBaris',{sheet:n,key});await refreshInit()}catch(e){toast(e.message,1)}render()}
function vMenu(){
  const P=S.all||[];
  const L=P.length?P.map(p=>`<button class=card style="flex-direction:row;align-items:center;gap:10px;width:100%;margin-bottom:8px;${p.Aktif===false?'opacity:.5':''}" onclick="editMenu('${esc(p.SKU)}')"><div class=ph style="width:56px;height:56px;margin:0;font-size:24px">${p.Foto?`<img src="${esc(p.Foto)}">`:'\u2615'}</div><div style="flex:1"><b>${esc(p.Nama)}</b><br><small>${esc(p.Kategori)} \u00b7 ${rp(p.Harga)}${p.Aktif===false?' \u00b7 nonaktif':''}</small>${hppLine(p)}</div></button>`).join(''):'<div class=empty>Belum ada menu.</div>';
  return `<button class="btn ac" onclick="editMenu('')" style="margin-bottom:12px">+ Tambah Menu</button>${L}<h2 style="margin-top:20px">Pengaturan Order</h2>`+CFG.map(cfgBox).join('')}
function vForm(){const f=S.sheet.f;return `<h2>${f.SKU?'Edit Menu':'Menu Baru'}</h2><div class=ph style="height:120px" onclick="document.getElementById('ff').click()">${f.Foto?`<img src="${esc(f.Foto)}">`:'<span style="font-size:15px;color:var(--mut)">Ketuk untuk pilih foto</span>'}</div><input id=ff type=file accept="image/*" hidden onchange="pilihFoto(this)"><input class=in placeholder="Nama menu" value="${esc(f.Nama)}" oninput="S.sheet.f.Nama=this.value"><input class=in list=kl placeholder="Kategori" value="${esc(f.Kategori)}" oninput="S.sheet.f.Kategori=this.value"><datalist id=kl>${kats().map(k=>`<option value="${esc(k)}">`).join('')}</datalist><input class=in type=number inputmode=numeric placeholder="Harga (Rp)" value="${esc(f.Harga)}" oninput="S.sheet.f.Harga=this.value"><label class=row style="border:0"><span>Tampil di kasir</span><input type=checkbox ${f.Aktif!==false?'checked':''} onchange="S.sheet.f.Aktif=this.checked" style="width:24px;height:24px"></label>${f.SKU?`<button class="btn ghost" style="margin-bottom:8px" onclick="bukaResep('${esc(f.SKU)}')">Atur Resep & HPP</button>`:''}<button class="btn ac" onclick="simpanMenu()">Simpan Menu</button>`}

S.bahan=[];S.qb='';
const fmt=n=>Number(n||0).toLocaleString('id-ID',{maximumFractionDigits:2}),low=b=>Number(b.Stok)<=Number(b.Minimum),gb=k=>S.bahan.find(x=>String(x.SKU)===k);
async function loadStok(){try{S.bahan=await api('listBahan')}catch(e){toast(e.message,1)}render()}
function detBahan(k){S.sheet={t:'bdet',b:gb(k)};render()}
function aksiStok(m){S.sheet={t:'stok',m,b:S.sheet.b,qty:'',harga:'',alasan:'Dibuka (pemakaian)'};render()}
function editBahan(k){const b=gb(k);S.sheet={t:'bform',f:b?{SKU:b.SKU,Nama:b.Nama,Satuan:b.Satuan,Tipe:b.Tipe,Isi:b['Isi per Kemasan'],Minimum:b.Minimum}:{SKU:'',Nama:'',Satuan:'ml',Tipe:'Bahan',Isi:'',Minimum:''}};render()}
function prev(){const e=document.getElementById('prev');if(!e)return;const s=S.sheet,i=Number(s.b['Isi per Kemasan'])||0;e.textContent=i&&s.harga!==''?'Harga per '+s.b.Satuan+': '+rp(Number(s.harga)/i)+' \u00b7 Total '+rp(Number(s.harga)*Number(s.qty||0)):''}
async function kirimStok(){const s=S.sheet,b=s.b,q=s.qty;if(q===''||isNaN(+q)||(s.m==='audit'?+q<0:+q<=0))return toast('Jumlah tidak valid',1);
  const act={in:'stokIn',out:'stokOut',audit:'auditStok'}[s.m],data=s.m==='audit'?{sku:b.SKU,fisik:+q}:{sku:b.SKU,qty:+q,harga:s.harga,alasan:s.alasan};
  try{const r=await api(act,data);toast('Tersimpan \u2713 Stok: '+fmt(r.stok));S.sheet=null;await loadStok()}catch(e){toast(e.message,1)}}
async function simpanBahan(){const f=S.sheet.f;try{await api('saveBahan',{sku:f.SKU,nama:f.Nama,satuan:f.Satuan,tipe:f.Tipe,isi:f.Isi,minimum:f.Minimum});toast('Bahan tersimpan \u2713');S.sheet=null;await loadStok()}catch(e){toast(e.message,1)}}
async function hapusBahan(k){if(!confirm('Hapus bahan ini? Riwayat stok tetap tersimpan.'))return;try{await api('hapusBahan',{sku:k});S.sheet=null;toast('Dihapus');await loadStok()}catch(e){toast(e.message,1)}}
function vDaftar(){
  const q=S.qb.toLowerCase(),B=S.bahan.filter(b=>(String(b.Nama)+String(b.SKU)).toLowerCase().includes(q)),n=S.bahan.filter(low).length;
  return (n?`<div class=box style="border-color:var(--ac);background:var(--acs)"><b>\u26a0 ${n} bahan menipis</b></div>`:'')+`<input class=in placeholder="Cari bahan / SKU" value="${esc(S.qb)}" onchange="S.qb=this.value;render()">`+(S.user.role==='Owner'?`<button class="btn ac" style="margin-bottom:12px" onclick="editBahan('')">+ Tambah Bahan</button>`:'')+
  (B.length?B.map(b=>`<button class=card style="flex-direction:row;justify-content:space-between;align-items:center;width:100%;margin-bottom:8px" onclick="detBahan('${esc(b.SKU)}')"><div><b>${esc(b.Nama)}</b><br><small>${esc(b.SKU)} \u00b7 isi ${fmt(b['Isi per Kemasan'])} ${esc(b.Satuan)} \u00b7 ${rp(b['Harga Terakhir'])}/${esc(b.Satuan)}</small></div><div style="text-align:right"><b class="${low(b)?'bad':''}" style="font-size:20px">${fmt(b.Stok)}</b><br><small>kemasan \u00b7 min ${fmt(b.Minimum)}</small></div></button>`).join(''):'<div class=empty>Belum ada bahan.</div>')}

function vDash(){
  const P=S.dp,D=S.dash;
  const f=`<div class=chips>${[[1,'Hari ini'],[7,'7 Hari'],[30,'1 Bulan']].map(([n,l])=>`<button class="chip ${P.k===n?'on':''}" onclick="setDP(${n})">${l}</button>`).join('')}<button class="chip ${P.k==='x'?'on':''}" onclick="S.dp.k='x';render()">Kustom</button></div>${P.k==='x'?`<div style="display:flex;gap:8px"><input type=date class=in value="${P.dari}" onchange="S.dp.dari=this.value;loadDash()"><input type=date class=in value="${P.sampai}" onchange="S.dp.sampai=this.value;loadDash()"></div>`:''}`;
  if(!D)return f+'<div class=empty>Memuat data...</div>';
  const pc=(a,b)=>b?Math.round(a/b*100)+'%':'0%',cl=v=>v>=0?'ok':'bad';
  const card=(t,v,s,c)=>`<div class=box style="margin:0"><div class=lbl style="margin:0">${t}</div><b class="${c||''}" style="font-size:19px">${rp(v)}</b>${s?`<br><small style="color:var(--mut)">${s}</small>`:''}</div>`;
  const days=[];for(let t=new Date(P.dari+'T00:00:00Z'),e=new Date(P.sampai+'T00:00:00Z');t<=e&&days.length<62;t=new Date(t.getTime()+864e5))days.push(t.toISOString().slice(0,10));
  const vals=days.map(x=>D.harian[x]||0),mx=Math.max(1,...vals);

  const top=D.terlaris.length?D.terlaris.map((m,i)=>`<div class=row><span>${i+1}. ${esc(m.menu)}</span><span><b>${fmt(m.qty)}</b> terjual \u00b7 ${rp(m.omzet)}</span></div>`).join(''):'<div class=lbl>Belum ada penjualan.</div>';
  const met=D.metode.length?D.metode.map(m=>`<div class=row><span>${esc(m.metode)}</span><b>${rp(m.jumlah)}</b></div>`).join(''):'<div class=lbl>Belum ada pembayaran.</div>';
  const lw=D.menipis.length?D.menipis.map(b=>`<div class=row><span>${esc(b.nama)}</span><b class=bad>${fmt(b.stok)} / min ${fmt(b.min)}</b></div>`).join(''):'<div class=lbl>Semua stok aman \u2713</div>';
  return f+`<div class=grid style="margin-bottom:10px">${card('Omzet penjualan',D.omzet,D.order+' order \u00b7 '+D.item+' item')}${card('HPP penjualan',D.hpp,'')}${card('Laba kotor',D.labaKotor,'Margin '+pc(D.labaKotor,D.omzet),cl(D.labaKotor))}${card('Laba bersih',D.labaBersih,'Margin '+pc(D.labaBersih,D.omzet)+' (setelah Kas Out)',cl(D.labaBersih))}${card('Pemasukan kas',D.omzet+D.kasIn,'Penjualan + Kas In')}${card('Pengeluaran kas',D.stokIn+D.kasOut,'Stok In '+rp(D.stokIn)+' + Kas Out '+rp(D.kasOut))}</div>${chart}<div class=box><b>Produk terlaris</b>${top}</div><div class=box><b>Per metode bayar</b>${met}</div><div class=box><b>Stok menipis</b>${lw}</div>`}

function lapTeks(l){const rr=n=>'Rp '+Number(n||0).toLocaleString('id-ID'),L=[],M=l.metode||[],J=l.jenis||[];
  L.push('SHIFT REPORT SETTLEMENT',S.init.toko||'','--------------------------------','Operator : '+l.operator,'Mulai    : '+(l.mulai||'-'),'Selesai  : '+l.selesai,'--------------------------------','Total Omzet : '+rr(l.omzet),'Total Order : '+l.order,'Total Qty   : '+l.qty,'','METODE PEMBAYARAN');
  M.forEach(m=>L.push(m.metode+' : '+rr(m.jumlah)));L.push('Total Settlement : '+rr((+l.tunai||0)+(+l.nonTunai||0)),'','JENIS PESANAN');
  if(!J.length)L.push('-');J.forEach(j=>L.push(j.jenis+' : '+j.order+' order, '+j.qty+' item, '+rr(j.omzet)));
  L.push('','KAS LACI','Kas Awal : '+rr(l.kasAwal),'Kas In   : '+rr(l.kasIn));(l.masuk||[]).forEach(k=>L.push('  + '+k.jam+' '+k.ket+' '+rr(k.jumlah)));L.push('Kas Out  : '+rr(l.kasOut));(l.keluar||[]).forEach(k=>L.push('  - '+k.jam+' '+k.ket+' '+rr(k.jumlah)));
  L.push('','Kas Seharusnya : '+rr(l.kasSeharusnya),'Jumlah Uang    : '+rr(l.fisik),'Selisih        : '+(l.selisih>0?'+':'')+rr(l.selisih));if(l.catatan)L.push('','Catatan: '+l.catatan);return L.join('\n')}

function vLaporan(){const P=S.lp,D=S.lap;
  const f=`<div class=chips>${[[1,'Hari ini'],[7,'7 Hari'],[30,'1 Bulan']].map(([n,l])=>`<button class="chip ${P.k===n?'on':''}" onclick="setLP(${n})">${l}</button>`).join('')}<button class="chip ${P.k==='x'?'on':''}" onclick="S.lp.k='x';render()">Kustom</button></div>${P.k==='x'?`<div style="display:flex;gap:8px"><input type=date class=in value="${P.dari}" onchange="S.lp.dari=this.value;loadLap()"><input type=date class=in value="${P.sampai}" onchange="S.lp.sampai=this.value;loadLap()"></div>`:''}`;
  if(!D)return f+'<div class=empty>Memuat data...</div>';
  const kv=(l,v,c,b)=>`<div class=row><span${b?' style="font-weight:700"':''}>${l}</span><b class="${c||''}">${v}</b></div>`,bx=(t,h)=>`<div class=box><b>${t}</b>${h}</div>`,cl=v=>v>=0?'ok':'bad';
  const lr=kv('Pendapatan penjualan',rp(D.omzet))+kv('HPP','- '+rp(D.hpp))+kv('Laba kotor',rp(D.labaKotor)+' ('+pct(D.marginKotor)+')',cl(D.labaKotor),1)+D.biaya.map(b=>kv('Biaya: '+esc(b.ket),'- '+rp(b.jumlah))).join('')+kv('Total biaya operasional','- '+rp(D.kasOut))+kv('Laba bersih',rp(D.labaBersih)+' ('+pct(D.marginBersih)+')',cl(D.labaBersih),1);
  const bep=D.bepRp===null?'<div class=lbl>BEP belum bisa dihitung (laba kotor belum positif).</div>':kv('Biaya tetap (Kas Out)',rp(D.kasOut))+kv('Rasio kontribusi',pct(D.cm))+kv('BEP omzet periode',rp(D.bepRp))+kv('BEP omzet per hari',rp(D.bepHarian))+kv('Omzet rata-rata per hari',rp(D.omzetHarian))+kv('BEP jumlah item',fmt(Math.ceil(D.bepQty||0)))+kv('Margin of safety',pct(D.mos),cl(D.mos))+`<div class=lbl style="margin:6px 0 0">${D.omzet>=D.bepRp?'Sudah melewati titik impas.':'Belum mencapai titik impas.'}</div>`;
  const hr=D.harian.length?D.harian.map(h=>kv(esc(h.tgl)+' \u00b7 '+h.order+' order',rp(h.omzet))).join(''):'<div class=lbl>Belum ada penjualan.</div>';
  const mn=D.menu.length?D.menu.map(m=>kv(esc(m.menu)+' \u00b7 '+fmt(m.qty)+' item',rp(m.omzet)+' \u00b7 laba '+rp(m.omzet-m.hpp))).join(''):'<div class=lbl>Belum ada penjualan.</div>';
  const jn=D.jenis.map(j=>kv(esc(j.jenis)+' \u00b7 '+j.order+' order \u00b7 '+j.qty+' item',rp(j.omzet))).join('')||'<div class=lbl>-</div>';
  const mt=D.metode.map(m=>kv(esc(m.metode),rp(m.jumlah))).join('')||'<div class=lbl>-</div>';
  const ak=kv('Penjualan',rp(D.omzet))+kv('Kas In',rp(D.kasIn))+kv('Pembelian bahan (Stok In)','- '+rp(D.stokIn))+kv('Kas Out','- '+rp(D.kasOut))+kv('Arus kas bersih',rp(D.omzet+D.kasIn-D.stokIn-D.kasOut),cl(D.omzet+D.kasIn-D.stokIn-D.kasOut),1)+kv('Nilai persediaan saat ini',rp(D.nilaiStok));
  return f+`<button class="btn ac" style="margin-bottom:10px" onclick="eksporLap()">Ekspor ke Google Sheet</button>`+bx('Laba Rugi',lr)+bx('Break Even Point (BEP)',bep)+bx('Arus Kas',ak)+bx('Penjualan per Hari',hr)+bx('Penjualan per Menu',mn)+bx('Per Jenis Pesanan',jn)+bx('Per Metode Bayar',mt)}

function vUform(){const s=S.sheet,f=s.f;return `<h2>${s.baru?'Pengguna Baru':'Edit Pengguna'}</h2>${s.baru?`<input class=in placeholder="Username" autocapitalize=off value="${esc(f.username)}" oninput="S.sheet.f.username=this.value">`:`<div class=lbl>Username: <b>${esc(f.username)}</b></div>`}<input class=in placeholder="Nama (tampil di struk dan riwayat)" value="${esc(f.nama)}" oninput="S.sheet.f.nama=this.value"><input class=in placeholder="${s.baru?'Password (min. 6 karakter)':'Password baru (kosongkan jika tidak diganti)'}" oninput="S.sheet.f.password=this.value"><div class=lbl>Peran</div><div class=chips>${['Kasir','Owner'].map(r=>`<button class="chip ${f.role===r?'on':''}" onclick="S.sheet.f.role='${r}';render()">${r}</button>`).join('')}</div><label class=row style="border:0"><span>Akun aktif</span><input type=checkbox ${f.aktif?'checked':''} onchange="S.sheet.f.aktif=this.checked" style="width:24px;height:24px"></label><button class="btn ac" onclick="simpanUser()">Simpan</button>`}
function vSet(){
  const me=`<div class=box><b>Akun saya</b><div class=lbl style="margin:4px 0 8px">${esc(S.user.nama)} \u00b7 ${esc(S.user.role)} \u00b7 ${esc(S.user.username)}</div><input id=pw0 class=in type=password placeholder="Password lama"><input id=pw1 class=in type=password placeholder="Password baru (min. 6 karakter)"><input id=pw2 class=in type=password placeholder="Ulangi password baru"><button class="btn ghost" onclick="gantiPw()">Ganti Password</button></div>`;
  if(!own())return me;
  const pr=`<div class=box><b>Profil toko</b><input id=pf0 class=in style="margin-top:8px" placeholder="Nama toko" value="${esc(S.profil.nama)}"><input id=pf1 class=in placeholder="Alamat (tampil di struk)" value="${esc(S.profil.alamat)}"><input id=pf2 class=in placeholder="Footer struk (mis. Terima kasih)" value="${esc(S.profil.footer)}"><button class="btn ghost" onclick="simpanProfil()">Simpan Profil</button></div>`;
  const us=`<div class=box><b>Pengguna</b>${S.users.map((x,i)=>`<div class=row onclick="editUser(${i})" style="cursor:pointer"><div><b>${esc(x.nama)}</b><br><small>${esc(x.username)} \u00b7 ${esc(x.role)}</small></div><b class="${x.aktif?'ok':'bad'}">${x.aktif?'Aktif':'Nonaktif'}</b></div>`).join('')}<button class="btn ac" style="margin-top:10px" onclick="S.sheet={t:'uform',baru:1,f:{username:'',nama:'',role:'Kasir',aktif:true,password:''}};render()">+ Tambah Pengguna</button></div>`;
  return me+pr+us}
function vKasir(){
  const q=S.q.toLowerCase(),ps=S.init.produk.filter(p=>String(p.Nama).toLowerCase().includes(q));
  return `<input class=in placeholder="Cari menu" value="${esc(S.q)}" onchange="S.q=this.value;render()">`+
  (ps.length?`<div class=grid>${ps.map(p=>`<button class=card onclick="pick('${esc(p.SKU)}')"><div class=ph>${p.Foto?`<img src="${esc(p.Foto)}">`:'\u2615'}</div><b>${esc(p.Nama)}</b><small>${rp(p.Harga)}</small></button>`).join('')}</div>`:'<div class=empty>Belum ada menu.<br>Tambahkan di sheet Produk.</div>');
}
function vRiwayat(){return `<input type=date class=in value="${S.tgl}" onchange="S.tgl=this.value;loadTx()">`+
 (S.tx.length?S.tx.map(o=>`<div class=box><div class=row style="border:0"><b class="${o.status==='VOID'?'void':''}">${esc(o.id)}</b><span class=tot style="font-size:18px">${rp(o.total)}</span></div><small style="color:var(--mut)">${esc(o.jam)} \u00b7 ${esc(o.kasir)} \u00b7 ${esc(o.kategori)} \u00b7 ${o.bayar.map(b=>esc(b.metode)).join('+')}</small>${o.items.map(i=>`<div>${i.qty}\u00d7 ${esc(i.menu)} <small>${esc([i.ukuran,i.es,i.gula].filter(Boolean).join('/'))}</small></div>`).join('')}${o.status==='VOID'?'<b class=bad>VOID</b>':`${vBtn(o.id)}`}</div>`).join(''):'<div class=empty>Belum ada transaksi di tanggal ini.</div>')}
function vSheet(){const s=S.sheet;if(!s)return'';let h='';
 if(s.t==='opsi'){const g=(j,k)=>opsi(j).length?`<div class=lbl>${j}</div><div class=chips>${opsi(j).map(o=>`<button class="chip ${s[k]===o.Nama?'on':''}" onclick="S.sheet.${k}='${esc(o.Nama)}';render()">${esc(o.Nama)}${o['Selisih Harga']>0?' +'+Number(o['Selisih Harga']).toLocaleString('id-ID'):''}</button>`).join('')}</div>`:'';
  h=`<h2>${esc(s.p.Nama)}</h2>${g('Ukuran','ukuran')}${g('Es','es')}${g('Gula','gula')}<div class=row style="border:0"><span>Jumlah</span><div class=qty><button onclick="S.sheet.qty=Math.max(1,S.sheet.qty-1);render()">\u2212</button><b>${s.qty}</b><button onclick="S.sheet.qty++;render()">+</button></div></div><button class="btn ac" onclick="addCart()">Tambah \u00b7 ${rp((Number(s.p.Harga)+ukSel(s.ukuran))*s.qty)}</button>`}
 if(s.t==='bayar'){h=`<h2>Pembayaran</h2><div class=lbl>Kategori order</div><div class=chips>${S.init.kategori.map(k=>`<button class="chip ${S.kat===k.Nama?'on':''}" onclick="S.kat='${esc(k.Nama)}';render()">${esc(k.Nama)}</button>`).join('')}</div>
  ${S.cart.map((i,x)=>`<div class=row><div><b>${esc(i.menu)}</b><br><small>${esc([i.ukuran,i.es,i.gula].filter(Boolean).join('/'))} \u00b7 ${rp(i.base+katSel())}</small></div><div class=qty><button onclick="chg(${x},-1)">\u2212</button><b>${i.qty}</b><button onclick="chg(${x},1)">+</button></div></div>`).join('')}
  <input class=in style="margin-top:10px" placeholder="Catatan (opsional)" value="${esc(S.cat)}" oninput="S.cat=this.value">${vPelBox()}<div class=lbl>Metode bayar (bisa lebih dari satu)</div>
  ${S.bayar.map((b,x)=>`<div style="display:flex;gap:8px"><select class=in style="flex:1" onchange="S.bayar[${x}].metode=this.value">${S.init.metode.map(m=>`<option ${m===b.metode?'selected':''}>${esc(m)}</option>`).join('')}</select><input id=bj${x} class=in style="flex:1" type=number inputmode=numeric placeholder="Jumlah" value="${b.jumlah}" oninput="S.bayar[${x}].jumlah=this.value;sum()"></div>`).join('')}
  <div style="display:flex;gap:8px;margin-bottom:8px"><button class="btn ghost" onclick="S.bayar.push({metode:S.init.metode[0],jumlah:''});render()">+ Metode</button><button class="btn ghost" onclick="S.bayar=[{metode:S.bayar[0].metode,jumlah:Math.max(0,total()-poinVal())}];render()">Uang pas</button></div><div id=sum></div><button id=go class="btn ac" onclick="simpan()">Simpan Transaksi</button>`}
 if(s.t==='sukses'){h=`<h2 class=ok>\u2713 Tersimpan</h2><div class=row><span>Total</span><b>${rp(S.last.total)}</b></div><div class=row><span>Kembalian</span><b>${rp(S.last.kembalian)}</b></div>${S.last.pelanggan?`<div class=row><span>Poin ${esc(S.last.pelanggan)}</span><b>+${S.last.poinDapat}${S.last.poinTukar?' / -'+S.last.poinTukar:''} \u00b7 saldo ${S.last.saldo}</b></div>`:''}<div style="display:grid;gap:8px;margin-top:12px"><button class=btn onclick="cetak(S.last)">Cetak Struk</button><button class="btn ghost" onclick="cetak(S.last,1)">Cetak Label</button><button class="btn ac" onclick="S.sheet=null;render()">Order Baru</button></div>`}
 if(s.t==='produk')h=vForm();if(s.t==='lap')h=vLap();if(s.t==='uform')h=vUform();if(s.t==='pilihpel')h=vPilih();if(s.t==='pform')h=vPform();if(s.t==='pdet')h=vPdet();if(s.t==='kpoin')h=vKpoin();if(s.t==='fitur')h=vMS();if(s.t==='kedit')h=vKE();if(s.t==='resep')h=vResep();if(s.t==='bdet')h=vBdet();if(s.t==='stok')h=vStokForm();if(s.t==='bform')h=vBForm();
 return `<div class=ov onclick="if(event.target===this&&S.sheet.t!=='sukses'){S.sheet=null;render()}"><div class=sheet>${h}</div></div>`}
function chg(x,d){S.cart[x].qty+=d;if(S.cart[x].qty<1)S.cart.splice(x,1);if(!S.cart.length)S.sheet=null;render()}

function render(){
  const A=$('#app'),_sc=document.querySelector('.sheet'),_y=_sc?_sc.scrollTop:0;
  if(!S.token||!S.init){A.innerHTML=`<div class=login><div class=logo>\u2615</div><h2>Kopi Tlusor POS</h2><input id=u class=in placeholder=Username autocapitalize=off><input id=p class=in type=password placeholder=Password><button class="btn ac" onclick="doLogin()" ${S.busy?'disabled':''}>${S.busy?'Memuat\u2026':'Masuk'}</button></div>`;
    if(S.token&&!S.init&&!S.busy){S.busy=1;boot().then(()=>{S.busy=0;render()}).catch(()=>{S.busy=0;logout()})}return}
  const body={kasir:vKasir,riwayat:vRiwayat,kas:vKas,stok:vStok,menu:vMenu,dash:vDash,void:vVoid,akt:vAkt,laporan:vLaporan,pelanggan:vPelanggan,pengaturan:vSet}[S.tab]();
  A.innerHTML=`<div class=wrap>${own()&&S.vp.length&&S.tab!=='void'?`<div class=box style="border-color:var(--ac);background:var(--acs)" onclick="go('void')"><b>${S.vp.length} pengajuan VOID menunggu konfirmasi</b></div>`:''}<h2>${({kasir:'Kasir',riwayat:'Riwayat Transaksi',kas:'Kas In / Kas Out',stok:'Stok Bahan',menu:'Menu & Resep',dash:'Dasbor',void:'Pengajuan VOID',akt:'Aktivitas & Closing',laporan:'Laporan Akuntansi',pelanggan:'Pelanggan',pengaturan:'Pengaturan'})[S.tab]||''}</h2>${body}</div>${S.tab==='kasir'&&S.cart.length&&!S.sheet?`<div class=bar><button class="btn ac" onclick="openBayar()">${cnt()} item \u00b7 ${rp(total())} \u2192 Bayar</button></div>`:''}
  ${vNav()}${S.drawer?vDrawer():''}${vSheet()}`;
  if(S.sheet&&S.sheet.t==='bayar')sum();if(S.sheet&&S.sheet.t==='stok')prev();if(S.tab==='akt')selUpd();const _s2=document.querySelector('.sheet');if(_s2)_s2.scrollTop=_y;
}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
